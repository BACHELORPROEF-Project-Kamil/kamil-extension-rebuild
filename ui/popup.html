<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Kamil - Uw digitale kameleon</title>
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<header class="header">
			<a href="https://www.kamil-extension.be/" target="_blank">
				<img src="/ui/assets/logo.svg" alt="donker groen logo met het woord Kamil en een punt erachter" class="logo" />
			</a>
			<div class="header-actions">
				<button id="settings-btn" class="settings-btn" aria-label="Instellingen">⚙️</button>
				<button id="close-btn" class="close-btn" aria-label="Sluiten">×</button>
			</div>
		</header>

		<main id="main-view" class="content-container">
			<div class="mascot-circle">
				<img src="/ui/assets/kamil_safe.webp" alt="Kamil de kameleon steekt zijn duim op" class="mascot-img" />
			</div>

			<h2 class="status-title">Alles is veilig.</h2>
			<p class="status-text">Kamil houdt de wacht... u kunt veilig surfen.</p>
			<a href="#" id="learn-more-link" class="link-primary">Lees hier meer over</a>
			<button id="leave-site-btn" class="btn-leave" style="display: none;">Website verlaten</button>
		</main>

		<main id="settings-view" class="content-container" style="display: none;">
			<h2 class="status-title">Instellingen</h2>
			<div class="settings-list">
				<div class="setting-item">
					<span class="setting-label">Kamil inschakelen</span>
					<label class="switch">
						<input type="checkbox" id="kamil-toggle" checked>
						<span class="slider round"></span>
					</label>
				</div>
				<p class="setting-description">Schakel Kamil uit als je tijdelijk geen bescherming wilt ontvangen.</p>
			</div>
			<button id="back-btn" class="link-primary" style="margin-top: 24px; text-decoration: none;">← Terug naar overzicht</button>
		</main>

		<footer class="footer">
			<p class="footer-text">Zie jij iets wat ik over het hoofd zag?</p>
			<button class="link-danger">Rapporteer deze website</button>
		</footer>

		<script src="popup.js"></script>
	</body>
</html>
